<title>Manzana vs. Pera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: una pantalla de cine a lo ancho; título arriba, controles de reproducción y escenas debajo. */
  :root {
    --bg: #0e0818;
    --panel: #1b1230;
    --line: #362a52;
    --fg: #f6eeff;
    --muted: #ad9dcc;
    --apple: #ff5a4d;
    --pear: #b8ef3c;
    --gold: #ffd23a;
    --display: "Bangers", Impact, "Arial Narrow Bold", sans-serif;
    --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; }
  .wrap { max-width: 1120px; margin-inline: auto; padding-block: 18px 28px; padding-inline: 16px; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 20px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 7vw, 62px); letter-spacing: .03em; line-height: 1; text-wrap: balance; }
  h1 .a { color: var(--apple); } h1 .p { color: var(--pear); } h1 .vs { color: var(--gold); font-size: .7em; padding-inline: .15em; }
  .sub { margin: 0; color: var(--muted); font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  .stage { background: #000; line-height: 0; border: 1px solid var(--line); }
  canvas { width: 100%; height: auto; display: block; max-width: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 15px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 9px 15px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--gold); color: #1a1030; border-color: var(--gold); }
  .seek { flex: 1 1 220px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .seek input { flex: 1; min-width: 0; accent-color: var(--gold); }
  .seek output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 7ch; text-align: right; }
  .scenes { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .scenes button { font-size: 13px; padding: 6px 11px; color: var(--muted); }
  .scenes button b { font-weight: 600; font-variant-numeric: tabular-nums; opacity: .7; margin-right: 6px; }
  .scenes button.on { color: #1a1030; background: var(--gold); border-color: var(--gold); }
</style>

<main class="wrap">
  <header>
    <h1><span class="a">Manzana</span><span class="vs">vs.</span><span class="p">Pera</span></h1>
    <p class="sub">Episodio 1 · La batalla del huerto</p>
  </header>

  <div class="stage"><canvas id="c" width="1440" height="810" aria-label="Episodio animado estilo anime: una manzana y una pera se transforman en súper sayayin, pelean a velocidad, chocan rayos de energía y todo explota"></canvas></div>

  <div class="controls">
    <div class="btns">
      <button id="play" type="button">Pausa</button>
      <button id="sound" type="button" aria-pressed="false">Activar sonido</button>
      <button id="slow" type="button" aria-pressed="false">Cámara lenta</button>
    </div>
    <label class="seek" for="seek"><input id="seek" type="range" min="0" max="45" step="0.01" value="0" aria-label="Posición del episodio"><output id="clock">00:00</output></label>
  </div>
  <ul class="scenes" id="scenes"></ul>
</main>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = 960, H = 540, S = cv.width / W, TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, u) => a + (b - a) * u;
  const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
  const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
  const eIn = x => Math.pow(clamp(x), 3);
  const R = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, u) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(u)))).join(',') + ')'; };
  const INK = '#140c12', RED = '#ff6a5a', GREEN = '#b8f04a', GOLD = '#ffd23a';

  let gt = 0, fr = 0, post = {};
  const SH = { x: 0, y: 0 };

  /* ================= cámara ================= */
  function cam(c, par = 1) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.translate(W / 2 + SH.x + (c.ox || 0), H / 2 + SH.y + (c.oy || 0));
    ctx.rotate(c.r || 0); ctx.scale(c.z, c.z); ctx.translate(-c.x * par, -c.y);
  }
  function screen() { ctx.setTransform(S, 0, 0, S, 0, 0); }
  function toScreen(c, x, y) {
    const dx = (x - c.x) * c.z, dy = (y - c.y) * c.z, r = c.r || 0;
    return [W / 2 + SH.x + (c.ox || 0) + dx * Math.cos(r) - dy * Math.sin(r), H / 2 + SH.y + (c.oy || 0) + dx * Math.sin(r) + dy * Math.cos(r)];
  }
  function shake(a) { SH.x = (R(fr * 1.31 + .5) - .5) * 2 * a; SH.y = (R(fr * 2.71 + 1.7) - .5) * 2 * a; }

  /* ================= escenario ================= */
  const FAR = [[-1500, 320, 250], [-950, 220, 190], [-420, 400, 290], [180, 260, 220], [640, 300, 260], [1200, 360, 300], [1800, 240, 210]];
  const MID = [[-1250, 240, 400], [-760, 170, 300], [-180, 150, 240], [820, 210, 430], [1380, 250, 350]];

  function sky(m) {
    screen();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix('#2b1d52', '#0a0612', m)); g.addColorStop(.55, mix('#c4566a', '#3a1a34', m)); g.addColorStop(1, mix('#ffb36b', '#6a3238', m));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const s = ctx.createRadialGradient(W * .68, H * .44, 10, W * .68, H * .44, 260);
    s.addColorStop(0, `rgba(255,236,190,${.9 * (1 - m)})`); s.addColorStop(.25, `rgba(255,190,120,${.45 * (1 - m)})`); s.addColorStop(1, 'rgba(255,150,80,0)');
    ctx.fillStyle = s; ctx.fillRect(0, 0, W, H);
  }
  function clouds(c, m) {
    cam(c, .08);
    for (let i = 0; i < 8; i++) {
      const x = -1700 + i * 480 + R(i) * 200, y = -560 - R(i + 3) * 300, w = 260 + R(i + 7) * 320;
      ctx.globalAlpha = .6;
      ctx.fillStyle = mix('#7a3a6a', '#1a1020', m); ctx.beginPath(); ctx.ellipse(x, y + 8, w, 20, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = mix('#f6a88a', '#3a2234', m); ctx.beginPath(); ctx.ellipse(x - 20, y, w * .8, 14, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function mesa(x, w, h, seed, cl, cd, ol, lw, broken) {
    const l = x - w / 2, r = x + w / 2, top = -h, pts = [[l - w * .14, 500], [l, top + h * .18]];
    for (let i = 0; i <= 5; i++) pts.push([lerp(l + w * .04, r - w * .04, i / 5), top + R(seed + i) * h * .07 + (broken ? R(seed * 3 + i) * h * .3 : 0)]);
    pts.push([r, top + h * .15], [r + w * .14, 500]);
    const path = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
    path(); ctx.fillStyle = cl; ctx.fill();
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = cd; ctx.beginPath(); ctx.moveTo(x + w * .12, top - 80); ctx.lineTo(r + w * .4, top - 80); ctx.lineTo(r + w * .4, 600); ctx.lineTo(x + w * .02, 600); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 3;
    for (let k = 1; k < 5; k++) { const yy = top + h * k / 5 + R(seed + k) * 10; ctx.beginPath(); ctx.moveTo(l - w * .2, yy); ctx.lineTo(r + w * .2, yy + R(seed + k * 2) * 12 - 6); ctx.stroke(); }
    ctx.restore();
    if (ol) { path(); ctx.strokeStyle = ol; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function ground(m) {
    const g = ctx.createLinearGradient(0, 0, 0, 700);
    g.addColorStop(0, mix('#d89a62', '#4a2c28', m)); g.addColorStop(1, mix('#6e3e2e', '#1a0e12', m));
    ctx.fillStyle = g; ctx.fillRect(-6000, 0, 12000, 4000);
    ctx.fillStyle = mix('#f0c088', '#6a4434', m); ctx.fillRect(-6000, -1, 12000, 4);
    ctx.fillStyle = mix('#a86a46', '#2e1c1c', m);
    for (let i = 0; i < 70; i++) { const x = (R(i) - .5) * 4000, y = 6 + R(i + 40) * 420, w = 10 + R(i + 9) * 40 * (1 + y / 200); ctx.beginPath(); ctx.ellipse(x, y, w, w * .18, 0, 0, TAU); ctx.fill(); }
  }
  function env(c, m, extra) {
    sky(m); clouds(c, m);
    cam(c, .3); for (const [x, w, h] of FAR) mesa(x, w, h, x, mix('#a85a72', '#2e1a30', m), mix('#74385a', '#1c1024', m), null, 0);
    cam(c, .6); for (const [x, w, h] of MID) mesa(x, w, h, x, mix('#c8704e', '#46282a', m), mix('#8a3c3a', '#26151a', m), INK, 2.5);
    cam(c, 1); ground(m);
    if (extra) extra();
  }

  /* ================= efectos ================= */
  function rockP(x, y, s, rot, seed, m = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const path = () => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU, r = s * (.7 + .4 * R(seed + i)); i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); };
    path(); ctx.fillStyle = mix('#a06a4c', '#4a2c26', m); ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = mix('#6a3a2c', '#24140f', m); ctx.fillRect(s * .1, -s * 2, s * 3, s * 4); ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, s * .13); ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();
  }
  function debris(x0, y0, t0, t, n, seed, o = {}) {
    const dt = t - t0; if (dt < 0) return;
    const sp = o.sp || 600, g = o.g ?? 1500, sz = o.size || 10, up = o.up ?? 400;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI * (.08 + .84 * R(seed + i)), v = sp * (.3 + .7 * R(seed + i * 7.1));
      const vx = Math.cos(a) * v, vy = Math.sin(a) * v - up * R(seed + i * 3.3);
      let x = x0 + vx * dt, y = y0 + vy * dt + .5 * g * dt * dt;
      if (y > 0) y = 0;
      rockP(x, y, sz * (.4 + R(seed + i * 11)), dt * (R(seed + i * 5) - .5) * 14, seed + i, o.m || 0);
    }
  }
  function dust(x, y, t0, t, size, seed, cl = '#e0b48a', cd = '#b4805e', life = 1.8) {
    const dt = t - t0; if (dt < 0 || dt > life) return;
    const e = eOut(dt / .9), a = 1 - clamp((dt - life * .45) / (life * .55));
    ctx.save(); ctx.globalAlpha = a;
    const P = [];
    for (let i = 0; i < 12; i++) {
      const ang = -Math.PI * R(seed + i), d = size * 1.6 * e * (.4 + .6 * R(seed + i * 3));
      P.push([x + Math.cos(ang) * d * 1.6, y + Math.sin(ang) * d * .6, size * (.35 + .35 * R(seed + i * 5)) * (.5 + e * .8)]);
    }
    ctx.fillStyle = cd; for (const [px, py, r] of P) { ctx.beginPath(); ctx.arc(px + r * .14, py + r * .12, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = cl; for (const [px, py, r] of P) { ctx.beginPath(); ctx.arc(px - r * .1, py - r * .12, r * .86, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  function cracks(x, t0, t, len, seed, glow) {
    if (t < t0) return;
    const e = eOut((t - t0) / .35);
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU + R(seed + k), L = len * (.5 + .5 * R(seed + k * 2)) * e, pts = [[x, 2]];
      for (let s = 1; s <= 6; s++) { const d = L * s / 6, aa = a + (R(seed + k * 9 + s) - .5) * .6; pts.push([x + Math.cos(aa) * d, 2 + Math.abs(Math.sin(aa)) * d * .22]); }
      const p = () => { ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); };
      p(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
      if (glow) { p(); ctx.strokeStyle = glow; ctx.lineWidth = 2; ctx.stroke(); }
    }
    ctx.restore();
  }
  function star(x, y, r, seed, a = 1, edge = GOLD) {
    if (a <= 0) return;
    const path = sc => { ctx.beginPath(); const n = 14; for (let i = 0; i < n * 2; i++) { const ang = i / (n * 2) * TAU + seed; const rr = (i % 2 ? r * (.18 + .12 * R(seed + i)) : r * (.55 + .6 * R(seed * 3 + i))) * sc; i ? ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr) : ctx.moveTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); } ctx.closePath(); };
    ctx.save(); ctx.globalAlpha = a;
    path(1); ctx.fillStyle = edge; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    path(.68); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }
  function ring(x, y, r, flat, w, a, col = '255,255,255') {
    if (a <= 0 || r <= 1) return;
    ctx.save(); ctx.strokeStyle = `rgba(${col},${clamp(a)})`; ctx.lineWidth = w;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * flat, 0, 0, TAU); ctx.stroke(); ctx.restore();
  }
  function bolt(x0, y0, x1, y1, seed, w = 3, col = '190,230,255') {
    const n = 10, pts = [], len = Math.hypot(x1 - x0, y1 - y0), nx = -(y1 - y0) / (len || 1), ny = (x1 - x0) / (len || 1);
    for (let i = 0; i <= n; i++) { const u = i / n, off = (i && i < n) ? (R(seed + i) - .5) * len * .2 : 0; pts.push([lerp(x0, x1, u) + nx * off, lerp(y0, y1, u) + ny * off]); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [lw, st] of [[w * 4, `rgba(${col},.25)`], [w * 1.8, `rgba(${col},.65)`], [w * .7, '#ffffff']]) {
      ctx.strokeStyle = st; ctx.lineWidth = lw; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    }
    ctx.restore();
  }
  function orb(x, y, r, c1, c2) {
    r = Math.max(1, r);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.3);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.22, c1); g.addColorStop(.5, c2); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath();
    const fi = Math.floor(gt * 24);
    for (let i = 0; i < 14; i++) { const a = R(fi * 3 + i) * TAU, l = r * (1.3 + R(fi + i * 7) * 1.1), wd = .05; ctx.moveTo(x + Math.cos(a - wd) * r * .5, y + Math.sin(a - wd) * r * .5); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.lineTo(x + Math.cos(a + wd) * r * .5, y + Math.sin(a + wd) * r * .5); }
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * .6, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function beam(x0, y0, x1, y1, w, cOut, cMid, seed) {
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 2) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x0, y0); ctx.rotate(Math.atan2(y1 - y0, x1 - x0));
    const wob = 1 + .08 * Math.sin(gt * 50 + seed);
    for (const [lw, col, al] of [[w * 2.2, cOut, .3], [w * 1.4, cOut, .7], [w * .9, cMid, .95], [w * .42, '#ffffff', 1]]) {
      ctx.globalAlpha = al; ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(0, -lw * .3 * wob); ctx.lineTo(len, -lw / 2 * wob); ctx.lineTo(len, lw / 2 * wob); ctx.lineTo(0, lw * .3 * wob); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = .85; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); for (let s = 0; s <= 40; s++) { const xx = s / 40 * len, yy = Math.sin(xx * .045 - gt * 34 + k * 2.1) * w * .5 * Math.min(1, xx / 80); s ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); }
    ctx.restore();
  }
  function sparks(x, y, t0, t, n, seed, sp = 900, col = '255,230,120') {
    const dt = t - t0; if (dt < 0 || dt > .6) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = R(seed + i) * TAU, v = sp * (.4 + .6 * R(seed + i * 3)), x1 = x + Math.cos(a) * v * dt, y1 = y + Math.sin(a) * v * dt + 400 * dt * dt;
      ctx.strokeStyle = `rgba(${col},${1 - dt / .6})`; ctx.lineWidth = 2 + R(seed + i * 5) * 3;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a) * v * .045, y1 - Math.sin(a) * v * .045); ctx.stroke();
    }
    ctx.restore();
  }
  function puffs(list, cl, cd) {
    ctx.fillStyle = cd; for (const [x, y, r] of list) { ctx.beginPath(); ctx.arc(x + r * .12, y + r * .12, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = cl; for (const [x, y, r] of list) { ctx.beginPath(); ctx.arc(x - r * .08, y - r * .12, r * .84, 0, TAU); ctx.fill(); }
  }
  function focus(cx, cy, seed, col, inner = 170, n = 70) {
    screen(); ctx.save(); ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = R(seed + i) * TAU, wd = .004 + R(seed + i * 3) * .014, ir = inner * (.8 + R(seed + i * 5) * .9);
      ctx.moveTo(cx + Math.cos(a) * ir, cy + Math.sin(a) * ir); ctx.lineTo(cx + Math.cos(a - wd) * 1100, cy + Math.sin(a - wd) * 1100); ctx.lineTo(cx + Math.cos(a + wd) * 1100, cy + Math.sin(a + wd) * 1100); ctx.closePath();
    }
    ctx.fill(); ctx.restore();
  }
  function streakBG(ang, c1, c2, spd) {
    screen();
    const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(ang); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineCap = 'round';
    for (let i = 0; i < 64; i++) {
      const y = (R(i) - .5) * 1300, len = 80 + R(i * 3) * 380, x = ((R(i * 7) * 2400 + gt * spd * (.6 + R(i * 5))) % 2400) - 1200;
      ctx.lineWidth = 1 + R(i * 9) * 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y); ctx.stroke();
    }
    ctx.restore();
  }
  function leaf(x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = '#5cbf3a'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(0, -8, 10, 0); ctx.quadraticCurveTo(0, 8, -10, 0); ctx.fill(); ctx.stroke(); ctx.restore();
  }

  /* ================= personajes ================= */
  const KA = { bottom: 58, fx: 6, fy: -4, fs: 1.1, topY: -48, ax: 1, hs: 1,
    base: '#e83a3c', shade: '#9c1832', light: '#ffb6a4', limb: '#d22c3a', limbS: '#8e1430',
    pants: '#27347a', pantsS: '#151c4a', boot: '#f4f2ee', bootS: '#b9b6c8', fist: '#ffffff', fistS: '#c6c4d4', band: '#ffffff', stem: '#5a3418', leaf: '#46b83a' };

    half([[0, 0], [W * .6, 0], [W * .4, H], [0, H]], KA, -300, 1, -W * .2, 'rgba(255,110,50,1)', 'rgba(255,40,20,.6)', 'rgba(255,120,90,.5)', 0);
    half([[W * .6, 0], [W, 0], [W, H], [W * .4, H]], KP, 300, -1, W * .2, 'rgba(170,255,70,1)', 'rgba(60,200,30,.6)', 'rgba(190,255,120,.5)', 99);
    screen(); ctx.beginPath(); ctx.moveTo(W * .6, 0); ctx.lineTo(W * .4, H); ctx.lineWidth = 12; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    [['MAN...', .2], ['ZA...', .9], ['NA...', 1.6]].forEach(([s, t0], i) => { if (u > t0) callout(s, 120 + i * 40, 150 + i * 92, 64, GOLD, '#e8301e', -.08, 3, 1 + .5 * (1 - eOut((u - t0) / .15))); });
    [['PE...', .55], ['RA...', 1.25]].forEach(([s, t0], i) => { if (u > t0) callout(s, W - 150 - i * 40, 300 + i * 92, 64, GOLD, '#3aa01a', .08, 3, 1 + .5 * (1 - eOut((u - t0) / .15))); });
    if (u > d - .3) post.flash = (u - (d - .3)) / .3;
  }

  function sBeam(u, d) {
    const m = 1, AX = -430, PX = 430, meet = .35;
    shake(5 + u * 2.2 + (u > 4 ? (u - 4) * 10 : 0));
    const o = { pw: 1, ss: true, spark: true, eyes: 'angry', mouth: u < 1.2 ? 'scream' : 'grit', anger: u > 1, sweat: u > 1.5, dmg: .4 };
    const fa = F(KA, AX, 0, 1, 'beamfire', Object.assign({ rim: 'rgba(255,190,110,.55)' }, o));
    const fp = F(KP, PX, 0, -1, 'beamfire', Object.assign({ rim: 'rgba(210,255,140,.55)' }, o));
    const ha = fist(fa), hp = fist(fp), my = (ha[1] + hp[1]) / 2;
    let la, lp, cp = null;
    if (u < meet) { const e = eIn(u / meet); la = lerp(ha[0], 0, e); lp = lerp(hp[0], 0, e); }
    else { cp = 170 * Math.sin((u - meet) * 1.7) * clamp(u - meet) * (u > 4 ? Math.max(0, 1 - (u - 4)) : 1); la = lp = cp; }
    const closeA = u >= 1.7 && u < 2.4, closeP = u >= 2.9 && u < 3.5;
    let c;
    if (closeA) { const fw = L2W(fa, KA.fx, KA.fy); c = { x: fw[0] + 110, y: fw[1] + 10, z: 2.5, r: -.03 }; }
    else if (closeP) { const fw = L2W(fp, KP.fx, KP.fy); c = { x: fw[0] - 110, y: fw[1] + 10, z: 2.5, r: .03 }; }
    else c = { x: 0, y: -150, z: u > 4 ? .72 + .25 * eIn(u - 4) : .72 };
    env(c, m, () => {
      if (cp !== null) {
        cracks(0, meet, u, 700, 31, '#ffd23a');
        for (let j = 0; j < 6; j++) { const t0 = meet + j * .75; dust(cp, 0, t0, u, 110, 40 + j, '#8a6a5a', '#5a3a3a', 1.4); debris(cp, 0, t0, u, 8, 90 + j * 9, { sp: 700, up: 600, size: 10, m }); }
      }
    });
    cam(c, 1);
    fighter(fa); fighter(fp);
    const w = 44 + 6 * Math.sin(gt * 31);
    beam(ha[0], ha[1], la, my, w, 'rgba(255,70,30,1)', 'rgba(255,170,60,1)', 0);
    beam(hp[0], hp[1], lp, my, w, 'rgba(70,220,30,1)', 'rgba(190,255,90,1)', 2);
    orb(ha[0], ha[1], 34, 'rgba(255,170,60,1)', 'rgba(255,60,20,.5)'); orb(hp[0], hp[1], 34, 'rgba(190,255,90,1)', 'rgba(60,200,30,.5)');
    if (cp !== null) {
      orb(cp, my, 70 + 14 * Math.sin(gt * 37) + (u > 4 ? (u - 4) * 300 : 0), 'rgba(255,240,150,1)', 'rgba(255,150,40,.6)');
      const fi = Math.floor(gt * 12);
      for (let j = 0; j < 3; j++) { const s = fi * 3 + j; if (R(s) > .35) { const a = R(s + 1) * TAU, l = 200 + R(s + 2) * 300; bolt(cp, my, cp + Math.cos(a) * l, my + Math.sin(a) * l * .7, s, 2.5); } }
      const bk = Math.floor((u - meet) / .3); sparks(cp, my, meet + bk * .3, u, 24, bk * 11, 1200);
    }
    if (!closeA && !closeP && u < 1.4) {
      const pop = 1 + .5 * (1 - eOut(u / .2));
      callout('¡¡MANZANA-HAAA!!', W * .27, H * .2, 52, '#ff7a5a', '#ffe08a', -.06, 4, pop);
      callout('¡¡PERA-HAAA!!', W * .75, H * .2, 52, '#c8ff6a', '#ffe08a', .06, 4, pop);
    }
    post.impact = u >= meet && u < meet + .06 ? 1 : 0;
    if (u > d - .5) post.flash = (u - (d - .5)) / .5;
  }

  function sBoom(u, d) {
    shake(28 * Math.exp(-u * 1.3) + 2);
    const c = { x: 0, y: -330, z: .3 };
    env(c, 1);
    cam(c, 1);
    const r = 2600 * eOut(u / 1.2), a = clamp(1 - (u - 1.3) / 1.0);
    if (a > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(-9000, -9000, 18000, 9000); ctx.clip();
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.6, `rgba(255,240,170,${a})`); g.addColorStop(.85, `rgba(255,170,60,${a})`); g.addColorStop(1, `rgba(255,90,30,${a * .6})`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1, r), Math.max(1, r * .85), 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    ring(0, 0, r * 1.5, .15, 30, 1 - u / 1.6); ring(0, -r * .4, r * 1.15, .9, 20, (1 - u / 1.2) * .8);
    if (u > .9) {
      const k = u - .9, colH = lerp(350, 820, eOut(k / 1.6));
      ctx.save(); ctx.globalAlpha = clamp(k / .5);
      const list = [];
      for (let i = 0; i < 10; i++) list.push([(R(i + 7) - .5) * 120, -i / 10 * colH, 170 + R(i) * 70]);
      for (let i = 0; i < 18; i++) list.push([(R(i + 30) - .5) * 1100 * eOut(k / 1.2), -colH + (R(i + 50) - .5) * 300, 190 + R(i + 60) * 150]);
      for (let i = 0; i < 12; i++) list.push([(R(i + 80) - .5) * 2400 * eOut(k / 1.4), -R(i + 90) * 120, 160 + R(i + 95) * 120]);
      puffs(list, '#c47a4a', '#6a3a2e');
      ctx.restore();
    }
    post.impact = u < .07 ? 1 : u < .13 ? 2 : 0;
    if (u > .13) post.flash = Math.max(0, 1 - (u - .13) / .6);
  }

  function sAfter(u, d) {
    const m = .55; shake(u > 3.4 && u < 3.6 ? 6 : 0);
    const c = { x: 0, y: -110, z: 1.05 + u * .015 };
    env(c, m, () => {
      ctx.fillStyle = '#6a3e2e'; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 52, 640, 48, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3e2420'; ctx.beginPath(); ctx.ellipse(0, 60, 540, 34, 0, 0, TAU); ctx.fill();
      for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; rockP(Math.cos(a) * 650, 52 + Math.sin(a) * 48, 10 + R(i) * 14, i, i + 300, m); }
    });
    cam(c, 1);
    const fall = u > 3 ? eIn((u - 3) / .45) : 0;
    const mk = (K, x, face) => {
      const f = F(K, x, 40, face, 'tired', { dmg: 1, eyes: fall > .9 ? 'ko' : 'tired', mouth: 'pant', lean: Math.sin(gt * 6 + (face > 0 ? 0 : 1)) * .03 });
      if (fall > 0) { f.rot = face * 1.45 * fall; f.y = 40 + fall * (K.bottom + 38 - 62); f.mouth = 'flat'; }
      return f;
    };
    const fa = mk(KA, -140, 1), fp = mk(KP, 140, -1);
    if (u > .3 && u < 1.8) fa.mouth = 'talk';
    if (u > 1.9 && u < 3) fp.mouth = 'talk';
    fighter(fa); fighter(fp);
    dust(-60, 40, 3.45, u, 70, 5, '#a08070', '#6a5048', 1.5); dust(220, 40, 3.45, u, 70, 6, '#a08070', '#6a5048', 1.5);
    for (let i = 0; i < 9; i++) { const ph = (gt * .15 + R(i)) % 1, x = (R(i + 3) - .5) * 900, y = 40 - ph * 520; ctx.fillStyle = `rgba(90,80,90,${.35 * (1 - ph)})`; ctx.beginPath(); ctx.arc(x, y, 30 + ph * 60, 0, TAU); ctx.fill(); }
    if (u > .3 && u < 1.8) post.sub = ['MANZANA', 'Je... eres fuerte... Pera.', RED];
    else if (u > 1.9 && u < 3) post.sub = ['PERA', 'Tú tampoco... estás nada mal.', GREEN];
  }

  function sEnd(u, d) {
    sAfter(4, 4); post.sub = null;
    screen(); ctx.save();
    ctx.globalCompositeOperation = 'color'; ctx.fillStyle = '#b8864a'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#e8d8b8'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    const x = lerp(W + 420, W * .6, eOut(u / .35));
    ctx.save(); ctx.translate(x, H * .76); ctx.rotate(-.04); ctx.fillStyle = '#ffcc22'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-270, -42); ctx.lineTo(210, -42); ctx.lineTo(270, 0); ctx.lineTo(210, 42); ctx.lineTo(-270, 42); ctx.lineTo(-240, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    callout('CONTINUARÁ...', x - 20, H * .76, 60, '#ff5a1a', '#fff3b0', -.04, 0, 1);
    if (u > .9) {
      screen(); ctx.save(); ctx.globalAlpha = clamp((u - .9) / .4); ctx.font = '700 24px "Barlow Semi Condensed", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      const s = 'Próximo episodio: ¡La venganza del durazno!';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(s, W / 2, H * .18); ctx.fillStyle = '#fff'; ctx.fillText(s, W / 2, H * .18); ctx.restore();
    }
  }

  const SHOTS = [
    [2.8, sTitle], [3.5, sEstablish], [2.5, sPearTalk], [1.5, sEyes], [4, sApplePU], [2.3, sPearPU], [1.8, sClash],
    [5, sRush], [2, sCrash], [2.2, sRubble], [3.4, sCharge], [5, sBeam], [2.5, sBoom], [4, sAfter], [2.5, sEnd]
  ];
  const starts = []; let T = 0; for (const s of SHOTS) { starts.push(T); T += s[0]; }

  /* ================= posproducción ================= */
  const grainCv = document.createElement('canvas'); grainCv.width = grainCv.height = 256;
  { const g = grainCv.getContext('2d'), id = g.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
  const grainPat = ctx.createPattern(grainCv, 'repeat');
  let lastFilter = '';
  function finish() {
    screen();
    if (post.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${clamp(post.flash)})`; ctx.fillRect(0, 0, W, H); }
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .98); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,0,10,.5)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = .08; ctx.globalCompositeOperation = 'overlay'; ctx.translate(-R(fr) * 256, -R(fr + 9) * 256); ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
    if (post.lb) { const h = H * post.lb; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, h); ctx.fillRect(0, H - h, W, h); }
    if (post.sub) subtitle(...post.sub);
    const f = post.impact === 1 ? 'invert(1) grayscale(1) contrast(6)' : post.impact === 2 ? 'grayscale(1) contrast(6) sepia(1) saturate(8) hue-rotate(-35deg)' : 'none';
    if (f !== lastFilter) { cv.style.filter = f; lastFilter = f; }
  }

  let shotIdx = 0;
  function render() {
    fr = Math.floor(gt * 24); post = { impact: 0, flash: 0, lb: .08, sub: null }; SH.x = SH.y = 0;
    let i = SHOTS.length - 1; for (let k = 0; k < SHOTS.length; k++) if (gt < starts[k] + SHOTS[k][0]) { i = k; break; }
    shotIdx = i;
    ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    SHOTS[i][1](gt - starts[i], SHOTS[i][0]);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    finish();
    updateUI();
  }

  /* ================= sonido ================= */
  let ac = null, master = null, noiseB = null, soundOn = false;
  function initAudio() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ac = new AC(); master = ac.createGain(); master.gain.value = .5;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    noiseB = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const dd = noiseB.getChannelData(0); for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
    return true;
  }
  function env3(node, dur, g0, att) { const t = ac.currentTime, g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur); node.connect(g); g.connect(master); return t; }
  function nz(dur, type, f0, f1, q, g0, att = .005) {
    const s = ac.createBufferSource(); s.buffer = noiseB; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; const t = ac.currentTime; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); f.Q.value = q;
    s.connect(f); env3(f, dur, g0, att); s.start(t); s.stop(t + dur + .05);
  }
  function tone(dur, type, f0, f1, g0, att = .005) {
    const o = ac.createOscillator(); o.type = type; const t = ac.currentTime; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env3(o, dur, g0, att); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    hit: () => { tone(.25, 'sine', 180, 45, .9); nz(.12, 'bandpass', 1800, 600, 1, .6); },
    boom: () => { tone(.9, 'sine', 110, 30, 1); nz(1, 'lowpass', 1200, 80, .7, .8); },
    bigboom: () => { tone(1.4, 'sine', 90, 25, 1); tone(.5, 'square', 60, 30, .2); nz(1.6, 'lowpass', 2500, 60, .5, 1); },
    mega: () => { tone(3, 'sine', 70, 20, 1, .02); nz(3.2, 'lowpass', 4000, 50, .4, 1, .01); nz(2.5, 'bandpass', 300, 80, .6, .5, .2); },
    whoosh: () => nz(.4, 'bandpass', 300, 3000, 2, .5, .1),
    zip: () => { tone(.18, 'square', 1600, 200, .15); nz(.15, 'highpass', 3000, 6000, 1, .3); },
    shing: () => { tone(.9, 'sine', 2600, 2400, .25); tone(.7, 'triangle', 3900, 3700, .12); },
    rumble: d => nz(d, 'lowpass', 90, 160, 1, .6, d * .6),
    aura: d => { tone(d, 'sawtooth', 55, 62, .12, .2); nz(d, 'bandpass', 400, 900, 3, .25, .3); },
    charge: d => { tone(d, 'sawtooth', 70, 320, .14, d * .5); nz(d, 'bandpass', 300, 2400, 4, .3, d * .6); },
    beam: d => { tone(d, 'sawtooth', 48, 40, .18, .05); nz(d, 'bandpass', 700, 500, 1.2, .55, .05); nz(d, 'lowpass', 200, 150, 1, .5, .05); },
    thud: () => { tone(.35, 'sine', 90, 40, .7); nz(.3, 'lowpass', 500, 80, 1, .4); },
    sting: () => { [220, 277, 330, 440].forEach((f, i) => tone(1.4, 'sawtooth', f, f * .99, .07 + i * .01, .02)); nz(.6, 'highpass', 4000, 8000, 1, .15, .01); },
    wind: d => nz(d, 'bandpass', 500, 700, .6, .12, 1)
  };
  const EVR = [[0, 0, 'sting'], [1, 0, 'wind', 3.5], [3, 1.1, 'shing'], [4, 0, 'rumble', 4], [4, 2, 'boom'], [4, 2, 'aura', 2], [5, 0, 'rumble', .7], [5, .6, 'boom'], [5, .6, 'aura', 1.7],
    [6, .35, 'whoosh'], [6, .9, 'bigboom'], [7, 3, 'zip'], [7, 3.4, 'zip'], [7, 3.83, 'boom'], [8, 0, 'whoosh'], [8, .5, 'bigboom'], [10, 0, 'charge', 3.4],
    [11, 0, 'beam', 5], [11, .35, 'boom'], [12, 0, 'mega'], [13, 3.45, 'thud'], [14, 0, 'sting']];
  for (let k = 0; k < 8; k++) EVR.push([7, k * .375 + .15, 'hit']);
  const EV = EVR.map(([s, o, n, d]) => ({ t: starts[s] + o, n, d }));
  function fireSounds(a, b) { if (!soundOn || !ac) return; for (const e of EV) if (e.t > a && e.t <= b) SFX[e.n](e.d); }

  /* ================= interfaz ================= */
  const SCENES = [['Presentación', 0], ['Transformación', 4], ['Combate', 6], ['Rayos', 10], ['Explosión', 12], ['Final', 13]];
  const ul = document.getElementById('scenes');
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const sceneBtns = SCENES.map(([name, si]) => {
    const li = document.createElement('li'), b = document.createElement('button'), n = document.createElement('b');
    b.type = 'button'; n.textContent = fmt(starts[si]); b.append(n, document.createTextNode(name));
    b.addEventListener('click', () => { gt = starts[si] + .001; }); li.appendChild(b); ul.appendChild(li); return [b, si];
  });
  const playBtn = document.getElementById('play'), soundBtn = document.getElementById('sound'), slowBtn = document.getElementById('slow');
  const seek = document.getElementById('seek'), clock = document.getElementById('clock');
  seek.max = T.toFixed(2);
  let paused = false, speed = 1, scrubbing = false;
  playBtn.addEventListener('click', () => { paused = !paused; playBtn.textContent = paused ? 'Reproducir' : 'Pausa'; });
  slowBtn.addEventListener('click', () => { speed = speed === 1 ? .35 : 1; slowBtn.setAttribute('aria-pressed', String(speed !== 1)); });
  soundBtn.addEventListener('click', () => {
    if (!initAudio()) { soundBtn.textContent = 'Sin audio'; return; }
    soundOn = !soundOn; if (soundOn && ac.state === 'suspended') ac.resume();
    soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.textContent = soundOn ? 'Sonido activado' : 'Activar sonido';
  });
  seek.addEventListener('input', () => { scrubbing = true; gt = parseFloat(seek.value); });
  seek.addEventListener('change', () => { scrubbing = false; });
  let lastScene = -1;
  function updateUI() {
    if (!scrubbing) seek.value = gt.toFixed(2);
    clock.textContent = fmt(gt) + ' / ' + fmt(T);
    let si = 0; sceneBtns.forEach(([b, s], i) => { if (shotIdx >= s) si = i; });
    if (si !== lastScene) { lastScene = si; sceneBtns.forEach(([b], i) => b.classList.toggle('on', i === si)); }
  }

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paused = true; gt = starts[11] + 1.0; playBtn.textContent = 'Reproducir';
  }
  window.__seek = t => { paused = true; gt = t; render(); };

  let last = 0;
  function frame(ms) {
    const now = ms / 1000, dt = Math.min(.05, now - last); last = now;
    if (!paused && !scrubbing) {
      const prev = gt; gt += dt * speed;
      if (gt >= T) { fireSounds(prev, T); gt -= T; fireSounds(-1, gt); } else fireSounds(prev, gt);
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(ms => { last = ms / 1000; frame(ms); });
})();
